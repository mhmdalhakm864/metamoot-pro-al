publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.4.4
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  local_auth: ^2.3.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  google_generative_ai: ^0.4.6
  dash_chat_2: ^0.0.21

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/