name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Recreate android folder
        run: |
          rm -rf android
          flutter create . --org com.metamoot --project-name metamoot_pro_al --platforms=android --overwrite
          flutter pub get
      - name: Build APK
        run: flutter build apk --debug --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metamoot-apk
          path: build/app/outputs/flutter-apk/app-debug.apk